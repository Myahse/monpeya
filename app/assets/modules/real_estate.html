<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Immobilier</title>
  <style>
    :root { --green: #006D56; --text: #111827; --muted: #6B7280; --bg: #FFFFFF; --card: #F5F5F5; }
    html.djogana-embedded body { overscroll-behavior: none; -webkit-tap-highlight-color: transparent; background: var(--shell-bg, var(--bg)); }
    html.djogana-embedded ::-webkit-scrollbar { display: none; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 16px; }
    .search { display: flex; gap: 8px; margin-bottom: 20px; }
    .search input { flex: 1; border: 1px solid #E5E7EB; border-radius: 12px; padding: 12px 14px; font-size: 14px; }
    .search button { background: var(--green); color: #fff; border: none; border-radius: 12px; padding: 0 16px; font-weight: 700; }
    .card { background: var(--card); border-radius: 16px; padding: 14px; margin-bottom: 12px; display: flex; gap: 12px; align-items: center; }
    .thumb { width: 56px; height: 56px; border-radius: 12px; background: #D1FAE5; display: flex; align-items: center; justify-content: center; font-size: 24px; }
    .card h3 { font-size: 14px; font-weight: 800; margin-bottom: 4px; }
    .card p { font-size: 12px; color: var(--muted); }
    .badge { display: inline-block; margin-top: 6px; font-size: 11px; font-weight: 700; color: var(--green); }
  </style>
</head>
<body>
  <div class="search">
    <input type="search" placeholder="Rechercher un bien..." />
    <button>OK</button>
  </div>
  <div class="card"><div class="thumb">🏠</div><div><h3>Villa Cocody</h3><p>4 ch · 320 m² · Cocody</p><span class="badge">85 000 000 FCFA</span></div></div>
  <div class="card"><div class="thumb">🏢</div><div><h3>Appartement Plateau</h3><p>3 ch · 145 m² · Plateau</p><span class="badge">42 000 000 FCFA</span></div></div>
  <div class="card"><div class="thumb">🏡</div><div><h3>Maison Bingerville</h3><p>5 ch · 280 m² · Bingerville</p><span class="badge">62 000 000 FCFA</span></div></div>
</body>
</html>
