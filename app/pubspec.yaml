name: app
description: "Mon Peya — super app shell."

publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.10.8


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.0
  shared_preferences: ^2.3.2
  share_plus: ^7.2.1
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  flutter_contacts: ^1.1.9+2
  http: ^1.2.2
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.10.0
  webview_flutter_wkwebview: ^3.23.0
  webview_windows: ^0.4.0
  immo:
    path: ../packages/immo
  billetterie:
    path: ../packages/billetterie
  leadway:
    path: ../packages/leadway
  peyapay:
    path: ../packages/peyapay
  local_auth: ^2.3.0
  flutter_secure_storage: ^10.0.0
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.5.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/app-icons/mon peya.png"
  image_path_android: "assets/logo/app-icons/mon peya.png"
  image_path_ios: "assets/logo/app-icons/mon peya.png"
  image_path_ios_dark_transparent: "assets/logo/app-icons/mon peya-dark.png"
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  windows:
    generate: true
    image_path: "assets/logo/app-icons/mon peya.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/logo/app-icons/mon peya.png"


flutter:


  uses-material-design: true

  assets:
    - .env
    - .env.example
    - assets/images/
    - assets/logo/
    - assets/logo/app-icons/
    - assets/logo/banks/
    - assets/logo/cards/
    - ../packages/immo/assets/logo/immo/
    - ../packages/leadway/assets/logo/
    - ../packages/peyapay/assets/logo/cards/
