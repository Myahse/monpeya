name: app
description: "Mon Peya — super app shell."

publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.10.8


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.0
  shared_preferences: ^2.3.2
  share_plus: ^7.2.1
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  flutter_contacts: ^1.1.9+2
  http: ^1.2.2
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.10.0
  webview_flutter_wkwebview: ^3.23.0
  webview_windows: ^0.4.0
  immo:
    path: ../packages/immo
  billetterie:
    path: ../packages/billetterie
  leadway:
    path: ../packages/leadway
  sim:
    path: ../packages/sim
  grenier:
    path: ../packages/grenier
  peyapay:
    path: ../packages/peyapay
  local_auth: ^2.3.0
  flutter_secure_storage: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.5.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/app-icons/mon peya.png"
  image_path_android: "assets/logo/app-icons/mon peya.png"
  image_path_ios: "assets/logo/app-icons/mon peya.png"
  image_path_ios_dark_transparent: "assets/logo/app-icons/mon peya-dark.png"
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  windows:
    generate: true
    image_path: "assets/logo/app-icons/mon peya.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/logo/app-icons/mon peya.png"


flutter:


  uses-material-design: true

  fonts:
    - family: Urbanist
      fonts:
        - asset: assets/fonts/urbanist/Urbanist-Thin.ttf
          weight: 100
        - asset: assets/fonts/urbanist/Urbanist-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/urbanist/Urbanist-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/urbanist/Urbanist-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/urbanist/Urbanist-Light.ttf
          weight: 300
        - asset: assets/fonts/urbanist/Urbanist-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/urbanist/Urbanist-Regular.ttf
          weight: 400
        - asset: assets/fonts/urbanist/Urbanist-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/urbanist/Urbanist-Medium.ttf
          weight: 500
        - asset: assets/fonts/urbanist/Urbanist-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/urbanist/Urbanist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/urbanist/Urbanist-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/urbanist/Urbanist-Bold.ttf
          weight: 700
        - asset: assets/fonts/urbanist/Urbanist-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/urbanist/Urbanist-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/urbanist/Urbanist-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/urbanist/Urbanist-Black.ttf
          weight: 900
        - asset: assets/fonts/urbanist/Urbanist-BlackItalic.ttf
          weight: 900
          style: italic

  assets:
    - assets/images/
    - assets/logo/
    - assets/logo/app-icons/
    - assets/logo/banks/
    - assets/logo/cards/
    - ../packages/immo/assets/logo/immo/
    - ../packages/leadway/assets/logo/
    - ../packages/peyapay/assets/logo/cards/
