# Unit tests use in-memory H2 (Oracle compatibility mode).
spring.docker.compose.enabled=false
spring.datasource.url=jdbc:h2:mem:ticketing;MODE=Oracle;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
peya.api.enabled=false
ticketing.encrypt.key=test-encrypt-key-32-chars-minimum!!
ticketing.qr.secret=test-qr-encrypt-key-32-chars-minimum!!
spring.autoconfigure.exclude=\
  org.springframework.boot.r2dbc.autoconfigure.R2dbcAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.r2dbc.R2dbcDataAutoConfiguration,\
  org.springframework.boot.autoconfigure.batch.BatchAutoConfiguration,\
  org.springframework.boot.autoconfigure.ldap.LdapAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.ldap.LdapRepositoriesAutoConfiguration
