# Optional: shared Peya Oracle (VPN). Use: mvn spring-boot:run -Dspring-boot.run.profiles=peya,peya-oracle
spring.docker.compose.enabled=false

spring.datasource.url=${PEYA_ORACLE_JDBC_URL:}
spring.datasource.username=${PEYA_ORACLE_USERNAME:}
spring.datasource.password=${PEYA_ORACLE_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
