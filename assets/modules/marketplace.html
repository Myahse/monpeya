<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Mon Marché</title>
  <style>
    :root { --green: #006D56; --text: #111827; --muted: #6B7280; --bg: #FFFFFF; --card: #F5F5F5; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 16px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .product { background: var(--card); border-radius: 16px; padding: 12px; }
    .img { height: 72px; border-radius: 12px; background: #E5E7EB; margin-bottom: 8px; }
    .product h3 { font-size: 12px; font-weight: 800; margin-bottom: 4px; }
    .product p { font-size: 11px; color: var(--green); font-weight: 800; }
  </style>
</head>
<body>
  <div class="grid">
    <div class="product"><div class="img"></div><h3>Riz local 5 kg</h3><p>3 500 FCFA</p></div>
    <div class="product"><div class="img"></div><h3>Huile végétale 1L</h3><p>1 200 FCFA</p></div>
    <div class="product"><div class="img"></div><h3>Tomates fraîches</h3><p>800 FCFA / kg</p></div>
    <div class="product"><div class="img"></div><h3>Poulet fermier</h3><p>4 500 FCFA</p></div>
  </div>
</body>
</html>
