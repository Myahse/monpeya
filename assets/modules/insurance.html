<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Assurance</title>
  <style>
    :root { --green: #006D56; --text: #111827; --muted: #6B7280; --bg: #FFFFFF; --card: #F5F5F5; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 16px; }
    .hero { background: var(--green); color: #fff; border-radius: 18px; padding: 18px; margin-bottom: 16px; }
    .hero h2 { font-size: 18px; font-weight: 900; margin-bottom: 6px; }
    .hero p { font-size: 13px; opacity: 0.9; }
    .card { background: var(--card); border-radius: 16px; padding: 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .card span { font-size: 13px; font-weight: 800; }
    .card small { display: block; font-size: 11px; color: var(--muted); font-weight: 500; margin-top: 4px; }
    .cta { width: 100%; margin-top: 8px; background: var(--green); color: #fff; border: none; border-radius: 14px; padding: 14px; font-size: 14px; font-weight: 800; }
  </style>
</head>
<body>
  <div class="hero"><h2>Protégez ce qui compte</h2><p>Auto, habitation, santé — devis en 2 minutes.</p></div>
  <div class="card"><div><span>Assurance Auto</span><small>Tous risques · à partir de 45 000 F/mois</small></div><span>→</span></div>
  <div class="card"><div><span>Assurance Habitation</span><small>Appartement & villa</small></div><span>→</span></div>
  <div class="card"><div><span>Assurance Santé</span><small>Famille & entreprise</small></div><span>→</span></div>
  <button class="cta">Obtenir un devis</button>
</body>
</html>
