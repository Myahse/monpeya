<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Billetterie</title>
  <style>
    :root { --green: #006D56; --text: #111827; --muted: #6B7280; --bg: #FFFFFF; --card: #F5F5F5; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 16px; }
    .event { background: var(--card); border-radius: 16px; overflow: hidden; margin-bottom: 14px; }
    .banner { height: 90px; background: linear-gradient(135deg, #006D56, #059669); }
    .event body { padding: 14px; }
    .content { padding: 14px; }
    .content h3 { font-size: 14px; font-weight: 800; margin-bottom: 4px; }
    .content p { font-size: 12px; color: var(--muted); }
    .price { margin-top: 8px; font-size: 12px; font-weight: 800; color: var(--green); }
  </style>
</head>
<body>
  <div class="event"><div class="banner"></div><div class="content"><h3>Concert AFROBEATS Live</h3><p>Palais de la Culture · 12 Juillet</p><div class="price">À partir de 5 000 FCFA</div></div></div>
  <div class="event"><div class="banner"></div><div class="content"><h3>Match ASEC vs Africa Sports</h3><p>Stade FHB · 28 Juin</p><div class="price">À partir de 2 000 FCFA</div></div></div>
  <div class="event"><div class="banner"></div><div class="content"><h3>Festival N'Zassa Food</h3><p>Zone 4 · 5 Août</p><div class="price">Entrée gratuite · RSVP</div></div></div>
</body>
</html>
