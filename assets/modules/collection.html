<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Collection</title>
  <style>
    :root { --green: #006D56; --text: #111827; --muted: #6B7280; --bg: #FFFFFF; --card: #F5F5F5; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 16px; }
    h2 { font-size: 13px; font-weight: 800; margin-bottom: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .card { background: var(--card); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
    .card h3 { font-size: 14px; font-weight: 800; margin-bottom: 6px; }
    .card p { font-size: 12px; color: var(--muted); line-height: 1.5; }
    .pill { display: inline-block; margin-top: 8px; padding: 4px 10px; border-radius: 999px; background: #D1FAE5; color: var(--green); font-size: 11px; font-weight: 700; }
  </style>
</head>
<body>
  <h2>Recouvrement</h2>
  <div class="card"><h3>Loyer impayé — Apt. 12B</h3><p>M. Koné · 3 mois · 450 000 FCFA</p><span class="pill">En relance</span></div>
  <div class="card"><h3>Charges copropriété</h3><p>Résidence Les Palmiers · Lot 8</p><span class="pill">Plan de paiement</span></div>
  <div class="card"><h3>Dépôt de garantie</h3><p>Sortie locataire · Attente virement</p><span class="pill">À traiter</span></div>
</body>
</html>
