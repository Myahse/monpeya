spring.application.name=monpeya-platform
server.port=${SERVER_PORT:8081}
server.servlet.context-path=${SERVER_CONTEXT_PATH:/api/platform}

spring.messages.basename=errorMessage

# Start Oracle automatically when you run the app (requires Docker Desktop).
spring.docker.compose.enabled=${DOCKER_COMPOSE_ENABLED:true}
spring.docker.compose.file=compose.yaml

# Oracle — Monpeya auth database
spring.datasource.url=${DATASOURCE_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
spring.datasource.username=${DATASOURCE_USERNAME:monpeya}
spring.datasource.password=${DATASOURCE_PASSWORD:monpeya}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# PeyaPay — identity / wallet verification (auth service parses through this)
peya.api.enabled=${PEYA_API_ENABLED:true}
peya.api.base-url=${PEYA_API_BASE_URL:https://test1-pey-peya.djogana-pay.com}
peya.api.token-endpoint=${PEYA_TOKEN_ENDPOINT:/authclient/token}
peya.api.admin-username=${PEYA_APP_ADMIN_USERNAME:}
peya.api.admin-password=${PEYA_APP_ADMIN_PASSWORD:}
peya.api.code-pays-residence=${PEYA_CODE_PAYS_RESIDENCE:CI}
peya.api.crypto-url=${PEYA_CRYPTO_URL:https://djoganapayci.com/api10/peya-2.0/ncg}
peya.api.encrypt-payloads=true

# Monpeya-owned session
auth.access-token-hours=${AUTH_ACCESS_TOKEN_HOURS:12}
auth.refresh-token-days=${AUTH_REFRESH_TOKEN_DAYS:30}

# Monpeya access subscription prices (not ticketing fares) — override via .env
monpeya.subscription.currency=${SUBSCRIPTION_CURRENCY:XOF}
monpeya.subscription.client.code=${SUBSCRIPTION_CLIENT_PLAN_CODE:CLIENT_ACCESS}
monpeya.subscription.client.name=${SUBSCRIPTION_CLIENT_PLAN_NAME:Acces client}
monpeya.subscription.client.description=${SUBSCRIPTION_CLIENT_PLAN_DESC:Abonnement client Monpeya}
monpeya.subscription.client.price=${SUBSCRIPTION_CLIENT_PRICE:1000}
monpeya.subscription.business.code=${SUBSCRIPTION_BUSINESS_PLAN_CODE:BUSINESS_ACCESS}
monpeya.subscription.business.name=${SUBSCRIPTION_BUSINESS_PLAN_NAME:Acces business}
monpeya.subscription.business.description=${SUBSCRIPTION_BUSINESS_PLAN_DESC:Abonnement business Monpeya}
monpeya.subscription.business.price=${SUBSCRIPTION_BUSINESS_PRICE:5000}
