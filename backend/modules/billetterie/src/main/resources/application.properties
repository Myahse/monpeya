spring.application.name=billetterie
server.port=${SERVER_PORT:8090}
server.servlet.context-path=${SERVER_CONTEXT_PATH:/api/billetterie}

spring.messages.basename=errorMessage

# Start Oracle automatically when you run the app (requires Docker Desktop).
spring.docker.compose.enabled=${DOCKER_COMPOSE_ENABLED:true}
spring.docker.compose.file=compose.yaml

# Oracle — credentials
spring.datasource.url=${DATASOURCE_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
spring.datasource.username=${DATASOURCE_USERNAME:ticketing}
spring.datasource.password=${DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# Batch/LDAP starters on classpath but unused — keep off
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=never
spring.data.ldap.repositories.enabled=false

# Peya HTTP API (default on — set PEYA_API_ENABLED=false for local W_CLIENTS fallback)
peya.api.enabled=${PEYA_API_ENABLED:true}
peya.api.base-url=${PEYA_API_BASE_URL:https://test1-pey-peya.djogana-pay.com}
peya.api.token-endpoint=${PEYA_TOKEN_ENDPOINT:/authclient/token}
peya.api.admin-username=${PEYA_APP_ADMIN_USERNAME:${PEYAPAY_APP_USERNAME:}}
peya.api.admin-password=${PEYA_APP_ADMIN_PASSWORD:${PEYAPAY_APP_PASSWORD:}}
peya.api.code-pays-residence=${PEYA_CODE_PAYS_RESIDENCE:CI}
peya.api.crypto-url=${PEYA_CRYPTO_URL:https://djoganapayci.com/api10/peya-2.0/ncg}
peya.api.encrypt-payloads=true

ticket.purchase.debit.enabled=${TICKET_PURCHASE_DEBIT_ENABLED:false}

# Crypto — Mon peya parity (.env: ENCRYPT_KEY, QR_ENCRYPT_KEY)
ticketing.encrypt.key=${ENCRYPT_KEY:}
ticketing.qr.secret=${QR_ENCRYPT_KEY:${ENCRYPT_KEY:}}

# SecureQR validation (Flutter generates QR; server validates)
ticketing.qr.enable-encryption=true
ticketing.qr.enable-signature=true
ticketing.qr.check-expiration=false
ticketing.qr.validity-minutes=0

# OpenAPI / Swagger UI
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
