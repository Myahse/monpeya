spring.application.name=monpeya-server
server.port=${SERVER_PORT:8082}

spring.messages.basename=errorMessage

spring.docker.compose.enabled=false

# ── Platform datasource (schema monpeya) ─────────────────────────────────────
spring.datasource.platform.url=${PLATFORM_DATASOURCE_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
spring.datasource.platform.username=${PLATFORM_DATASOURCE_USERNAME:monpeya}
spring.datasource.platform.password=${PLATFORM_DATASOURCE_PASSWORD:monpeya}
spring.datasource.platform.driver-class-name=oracle.jdbc.OracleDriver

# ── Billetterie datasource (schema ticketing) ────────────────────────────────
spring.datasource.billetterie.url=${BILLETTERIE_DATASOURCE_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
spring.datasource.billetterie.username=${BILLETTERIE_DATASOURCE_USERNAME:ticketing}
spring.datasource.billetterie.password=${BILLETTERIE_DATASOURCE_PASSWORD:ticketing}
spring.datasource.billetterie.driver-class-name=oracle.jdbc.OracleDriver

# ── Immo datasource (schema immo) ────────────────────────────────────────────
spring.datasource.immo.url=${IMMO_DATASOURCE_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
spring.datasource.immo.username=${IMMO_DATASOURCE_USERNAME:immo}
spring.datasource.immo.password=${IMMO_DATASOURCE_PASSWORD:immo}
spring.datasource.immo.driver-class-name=oracle.jdbc.OracleDriver
immo.upload.dir=${IMMO_UPLOAD_DIR:uploads/immo}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Peya HTTP API
peya.api.enabled=${PEYA_API_ENABLED:true}
peya.api.base-url=${PEYA_API_BASE_URL:https://test1-pey-peya.djogana-pay.com}
peya.api.token-endpoint=${PEYA_TOKEN_ENDPOINT:/authclient/token}
peya.api.admin-username=${PEYA_APP_ADMIN_USERNAME:}
peya.api.admin-password=${PEYA_APP_ADMIN_PASSWORD:}
peya.api.code-pays-residence=${PEYA_CODE_PAYS_RESIDENCE:CI}
peya.api.crypto-url=${PEYA_CRYPTO_URL:https://djoganapayci.com/api10/peya-2.0/ncg}
peya.api.encrypt-payloads=true

# Platform auth
auth.access-token-hours=${AUTH_ACCESS_TOKEN_HOURS:12}
auth.refresh-token-days=${AUTH_REFRESH_TOKEN_DAYS:30}

# Billetterie
ticket.purchase.debit.enabled=${TICKET_PURCHASE_DEBIT_ENABLED:false}
ticketing.encrypt.key=${ENCRYPT_KEY:}
ticketing.qr.secret=${QR_ENCRYPT_KEY:${ENCRYPT_KEY:}}
ticketing.qr.enable-encryption=true
ticketing.qr.enable-signature=true
ticketing.qr.check-expiration=false

# OpenAPI
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html

# Subscriptions
monpeya.subscription.currency=${SUBSCRIPTION_CURRENCY:XOF}
